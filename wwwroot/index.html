<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriLesiones – Menú del día</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --txt:#1d2733; --mut:#5f6b7a; --brd:#dde3ea; --acc:#2f6f4f; --warn:#8a5a00; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { background:var(--acc); color:#fff; padding:18px 20px; }
  header h1 { margin:0; font-size:1.3rem; } header p { margin:4px 0 0; opacity:.85; font-size:.9rem; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  form { display:flex; flex-wrap:wrap; gap:10px; align-items:end; background:var(--card); border:1px solid var(--brd); border-radius:10px; padding:14px; }
  label { display:flex; flex-direction:column; font-size:.8rem; color:var(--mut); gap:4px; }
  input, select { padding:9px 10px; border:1px solid var(--brd); border-radius:8px; font-size:1rem; min-width:150px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--acc); color:#fff; font-size:.95rem; cursor:pointer; }
  button.sec { background:#e8eef3; color:var(--txt); }
  .resumen { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0; }
  .dato { background:var(--card); border:1px solid var(--brd); border-radius:10px; padding:10px 12px; }
  .dato b { display:block; font-size:1.15rem; } .dato span { font-size:.78rem; color:var(--mut); }
  .ok { color:var(--acc); } .mal { color:#b3261e; }
  .comida { background:var(--card); border:1px solid var(--brd); border-radius:10px; margin:14px 0; overflow:hidden; }
  .comida > h2 { margin:0; padding:10px 14px; background:#eaf3ee; font-size:1.05rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }
  .comida > h2 small { font-weight:400; color:var(--mut); font-size:.8rem; }
  .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; padding:14px; }
  .item { border:1px solid var(--brd); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .foto { position:relative; aspect-ratio:480/312; background:#e5e9ee; display:flex; align-items:center; justify-content:center; color:var(--mut); font-size:.85rem; }
  .foto img { width:100%; height:100%; object-fit:cover; display:block; }
  .tag { position:absolute; left:6px; top:6px; background:#fff3cd; color:var(--warn); font-size:.7rem; padding:2px 6px; border-radius:6px; }
  .info { padding:8px 10px; font-size:.88rem; }
  .info b { display:block; margin-bottom:2px; }
  .info .p { color:var(--acc); font-weight:600; } .info .m { color:var(--mut); font-size:.8rem; }
  details { padding:0 10px 8px; font-size:.8rem; } summary { cursor:pointer; color:var(--acc); }
  .alts { display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:6px; margin-top:6px; }
  .alt { text-align:center; font-size:.72rem; line-height:1.2; } .alt .foto { font-size:.65rem; border-radius:6px; overflow:hidden; }
  .avisos { background:#fff8e6; border:1px solid #f0d58a; color:var(--warn); border-radius:10px; padding:10px 14px; margin:14px 0; font-size:.88rem; }
  .avisos ul { margin:6px 0 0; padding-left:18px; }
  .err { color:#b3261e; margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1>NutriLesiones</h1>
  <p>Menú del día para futbolistas lesionados · alimentos y fotos del libro de intercambios (USFQ)</p>
</header>
<main>
  <form id="f">
    <label>Peso (kg)<input id="peso" type="number" min="25" max="150" step="0.1" value="65" required></label>
    <label>Fase de la lesión
      <select id="fase">
        <option value="inflamatoria">Inflamatoria</option>
        <option value="proliferativa">Proliferativa</option>
        <option value="remodelacion">Remodelación</option>
      </select>
    </label>
    <button type="submit">Generar menú</button>
    <button type="button" id="otro" class="sec" disabled>Otro menú</button>
  </form>
  <div id="err" class="err"></div>
  <div id="salida"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const num = n => Number(n).toLocaleString("es-EC", { maximumFractionDigits: 1 });

function foto(f, ref) {
  if (!f) return '<div class="foto">Sin foto</div>';
  return '<div class="foto"><img loading="lazy" src="/' + esc(f) + '" alt="">' + (ref ? '<span class="tag" title="' + esc(ref) + '">Foto de referencia</span>' : '') + '</div>';
}

function dibujar(p) {
  const r = p.requerimientos, a = p.adecuacion;
  const cls = v => (v >= 90 && v <= 110) ? "ok" : "mal";
  let h = '<div class="resumen">' +
    '<div class="dato"><b>' + num(r.kcal) + ' kcal</b><span>Requerimiento del día (' + r.kcalPorKg + ' kcal/kg)</span></div>' +
    '<div class="dato"><b>' + num(r.carbohidratos) + ' g</b><span>Carbohidratos · cubre <span class="' + cls(a.carbohidratos) + '">' + num(a.carbohidratos) + ' %</span></span></div>' +
    '<div class="dato"><b>' + num(r.proteina) + ' g</b><span>Proteína · cubre <span class="' + cls(a.proteina) + '">' + num(a.proteina) + ' %</span></span></div>' +
    '<div class="dato"><b>' + num(r.grasa) + ' g</b><span>Grasa · cubre <span class="' + cls(a.grasa) + '">' + num(a.grasa) + ' %</span></span></div>' +
    '<div class="dato"><b>' + num(p.totalDia.kcal) + ' kcal</b><span>Del menú · cubre <span class="' + cls(a.kcal) + '">' + num(a.kcal) + ' %</span></span></div></div>';
  if (p.advertencias.length) h += '<div class="avisos"><b>Avisos</b><ul>' + p.advertencias.map(w => '<li>' + esc(w) + '</li>').join('') + '</ul></div>';
  for (const c of p.comidas) {
    h += '<section class="comida"><h2><span>' + esc(c.nombre) + ' <small>' + esc(c.horario) + '</small></span><small>' +
         num(c.aporte.kcal) + ' kcal · CHO ' + num(c.aporte.cho) + ' g · prot ' + num(c.aporte.proteina) + ' g · grasa ' + num(c.aporte.grasa) + ' g</small></h2><div class="items">';
    for (const x of c.alimentos) {
      h += '<article class="item">' + foto(x.foto, x.fotoReferencia) +
           '<div class="info"><b>' + esc(x.nombre) + '</b><span class="p">' + num(x.porciones) + (x.porciones === 1 ? ' porción' : ' porciones') +
           '</span><div class="m">Cada porción: ' + esc(x.medidaPorPorcion) + ' (' + esc(x.pesoPorPorcionG) + ' g)</div></div>';
      if (x.alternativas.length) {
        h += '<details><summary>Intercambiar por (' + x.alternativas.length + ')</summary><div class="alts">' +
             x.alternativas.map(al => '<div class="alt">' + foto(al.foto, al.fotoReferencia) + esc(al.nombre.split(',')[0]) + '</div>').join('') + '</div></details>';
      }
      h += '</article>';
    }
    h += '</div></section>';
  }
  $("salida").innerHTML = h;
}

async function generar() {
  $("err").textContent = "";
  const body = { peso: parseFloat($("peso").value), fase: $("fase").value };
  try {
    const res = await fetch("/api/plan", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { $("err").textContent = data.error || "Error al generar el menú."; return; }
    dibujar(data); $("otro").disabled = false;
  } catch (e) { $("err").textContent = "No se pudo conectar con la API."; }
}
$("f").addEventListener("submit", e => { e.preventDefault(); generar(); });
$("otro").addEventListener("click", generar);
</script>
</body>
</html>
